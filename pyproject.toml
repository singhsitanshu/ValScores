[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "valscores-backend"
version = "0.1.0"
description = "Local FastAPI backend for ValScores"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastapi==0.141.1",
    "requests==2.34.2",
    "SQLAlchemy==2.0.52",
    "tzdata==2026.3",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
test = [
    "httpx2==2.12.0",
]

[tool.setuptools]
packages = ["valoreal"]
