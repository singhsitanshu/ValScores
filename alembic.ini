# Used only to author new revisions, e.g.:
#   alembic revision -m "describe the change"
# Apply migrations with `python -m valoreal.database upgrade` (docs/DATABASE.md).
# The database URL comes from the DATABASE_URL environment variable.
[alembic]
script_location = %(here)s/valoreal/database/migrations
file_template = %%(rev)s_%%(slug)s
